<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Link Management</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
header{background:linear-gradient(135deg,#0f172a,#1d4ed8);color:#fff;text-align:center;padding:24px 15px}
header h1{margin:0 0 6px}header p{margin:0;opacity:.9}
.wrap{max-width:1050px;margin:22px auto;padding:0 15px}.card{background:#fff;padding:20px;border-radius:15px;margin-bottom:18px;box-shadow:0 5px 20px #00000010}
h2{margin:0 0 15px}label{display:block;font-size:13px;font-weight:bold;margin:11px 0 6px}
input,select{width:100%;padding:12px;border:1px solid #d5dbe5;border-radius:9px;font-size:14px}
button{border:0;border-radius:9px;padding:11px 14px;font-weight:bold;cursor:pointer}.primary{background:#2563eb;color:#fff}.green{background:#16a34a;color:#fff}.red{background:#fee2e2;color:#b91c1c}.gray{background:#e5e7eb;color:#374151}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.hidden{display:none}
.tabs{display:flex;gap:8px}.tabs button{flex:1}.auth{max-width:460px;margin:35px auto}
.msg{display:none;padding:10px;border-radius:8px;margin:10px 0;font-size:13px}.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{background:#fff;padding:15px;border-radius:12px;box-shadow:0 4px 15px #0000000d}.stat b{font-size:24px;display:block}.stat span{font-size:12px;color:#64748b}
.toolbar{display:flex;gap:10px;margin-bottom:14px}.toolbar input{flex:1}.toolbar select{max-width:240px}
.item{border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin-bottom:10px}.top{display:flex;justify-content:space-between;gap:12px}.name{font-size:17px;font-weight:bold}.badge{display:inline-block;background:#dbeafe;color:#1d4ed8;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:bold;margin-top:5px}.url{font-size:13px;color:#64748b;word-break:break-all;margin-top:8px}.empty{text-align:center;padding:30px;color:#64748b;border:1px dashed #cbd5e1;border-radius:10px}
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.top{flex-direction:column}.toolbar{flex-direction:column}.toolbar select{max-width:none}}
</style>
</head>
<body>
<header><h1>Admin Link Management</h1><p>Firebase Online Link Management</p></header>

<section id="auth" class="wrap">
<div class="card auth">
<div class="tabs"><button id="lt" class="primary" onclick="mode('login')">Login</button><button id="rt" class="gray" onclick="mode('register')">Register</button></div>
<div id="am" class="msg"></div>
<div id="login">
<h2>🔐 Login</h2>
<label>Email</label><input id="le" type="email" placeholder="Enter email">
<label>Password</label><input id="lp" type="password" placeholder="Enter password">
<div class="actions"><button class="primary" onclick="login()">Login</button><button class="gray" onclick="reset()">Forgot Password?</button></div>
</div>
<div id="register" class="hidden">
<h2>👤 Register</h2>
<label>Name</label><input id="rn" placeholder="Your name">
<label>Email</label><input id="re" type="email" placeholder="Enter email">
<label>Password</label><input id="rp" type="password" placeholder="Minimum 6 characters">
<div class="actions"><button class="primary" onclick="register()">Create Account</button></div>
</div>
</div>
</section>

<section id="app" class="hidden">
<div style="background:#fff;border-bottom:1px solid #e5e7eb;padding:11px 15px;display:flex;justify-content:space-between;align-items:center">
<div>👤 <b id="ue"></b><br><small id="un"></small></div><button class="gray" onclick="logout()">Logout</button>
</div>
<div class="wrap">
<div class="stats"><div class="stat"><b id="t">0</b><span>Total Links</span></div><div class="stat"><b id="a">0</b><span>Admin</span></div><div class="stat"><b id="w">0</b><span>Website</span></div><div class="stat"><b id="rc">0</b><span>Repository + Cloud</span></div></div>

<div class="card">
<h2 id="ft">➕ Add Link</h2><div id="fm" class="msg"></div>
<label>Category</label><select id="cat"><option value="admin">Admin Link</option><option value="website">Website Link</option><option value="github">Repository Link by GitHub</option><option value="cloud">Cloud Data Save Link</option></select>
<label>Link Name</label><input id="name" placeholder="Example: Firebase Console">
<label>Link URL</label><input id="url" type="url" placeholder="https://example.com">
<div style="font-size:12px;color:#64748b;margin-top:6px">Sirf URL save karein. Password/API secret/private key save na karein.</div>
<div class="actions"><button class="primary" onclick="save()">💾 Save Link</button><button id="cancel" class="gray hidden" onclick="clearForm()">Cancel Edit</button></div>
</div>

<div class="card"><h2>🔗 Saved Links</h2>
<div class="toolbar"><input id="search" placeholder="Search name or URL..." oninput="render()"><select id="filter" onchange="render()"><option value="all">All Categories</option><option value="admin">Admin Link</option><option value="website">Website Link</option><option value="github">Repository Link by GitHub</option><option value="cloud">Cloud Data Save Link</option></select></div>
<div id="list"></div></div>
</div>
</section>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,sendPasswordResetEmail,signOut,onAuthStateChanged,updateProfile}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import{getFirestore,collection,addDoc,doc,getDoc,setDoc,updateDoc,deleteDoc,query,orderBy,onSnapshot}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

const config={apiKey:"AIzaSyAa7bJ7kEhaL1Ty1MsqMhHGgcvP6uRVKPI",authDomain:"admin-link-management.firebaseapp.com",projectId:"admin-link-management",storageBucket:"admin-link-management.firebasestorage.app",messagingSenderId:"64272413759",appId:"1:64272413759:web:9eb09e9ad129bbd816f48a",measurementId:"G-L0FWVWF2BF"};
const fb=initializeApp(config),auth=getAuth(fb),db=getFirestore(fb);
const labels={admin:"Admin Link",website:"Website Link",github:"Repository Link by GitHub",cloud:"Cloud Data Save Link"};
let data=[],editId=null,stop=null;

const $=id=>document.getElementById(id);
function msg(id,text,ok=false){$(id).textContent=text;$(id).className="msg "+(ok?"ok":"err");$(id).style.display="block"}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function error(e){return ({'auth/email-already-in-use':'Email already registered.','auth/invalid-email':'Invalid email.','auth/weak-password':'Password must be at least 6 characters.','auth/invalid-credential':'Email or password is incorrect.','auth/too-many-requests':'Too many attempts. Try later.'}[e.code]||e.message||'Something went wrong.')}

window.mode=x=>{$("login").classList.toggle("hidden",x!=="login");$("register").classList.toggle("hidden",x==="login");$("lt").className=x==="login"?"primary":"gray";$("rt").className=x==="register"?"primary":"gray";$("am").style.display="none"};
window.register=async()=>{try{let n=$("rn").value.trim(),e=$("re").value.trim(),p=$("rp").value;if(!n||!e||!p)return msg("am","Please fill all fields.");if(p.length<6)return msg("am","Password must be at least 6 characters.");let c=await createUserWithEmailAndPassword(auth,e,p);await updateProfile(c.user,{displayName:n});await setDoc(doc(db,"users",c.user.uid),{name:n,email:e,createdAt:new Date().toISOString()},{merge:true})}catch(e){msg("am",error(e))}};
window.login=async()=>{try{await signInWithEmailAndPassword(auth,$("le").value.trim(),$("lp").value)}catch(e){msg("am",error(e))}};
window.reset=async()=>{let e=$("le").value.trim();if(!e)return msg("am","Email enter karein.");try{await sendPasswordResetEmail(auth,e);msg("am","Password reset email sent. Inbox/spam check karein.",true)}catch(e){msg("am",error(e))}};
window.logout=()=>signOut(auth);

onAuthStateChanged(auth,async u=>{
 if(stop){stop();stop=null}
 if(!u){$("auth").classList.remove("hidden");$("app").classList.add("hidden");return}
 $("auth").classList.add("hidden");$("app").classList.remove("hidden");$("ue").textContent=u.email||"";$("un").textContent=u.displayName||"";
 try{let s=await getDoc(doc(db,"users",u.uid));if(s.exists())$("un").textContent=s.data().name||u.displayName||""}catch{}
 stop=onSnapshot(query(collection(db,"users",u.uid,"links"),orderBy("createdAt","desc")),s=>{data=s.docs.map(d=>({id:d.id,...d.data()}));render();stats()},e=>msg("fm","Firestore error: "+e.message))
});

window.save=async()=>{
 let u=auth.currentUser;if(!u)return;let category=$("cat").value,name=$("name").value.trim(),url=$("url").value.trim();
 if(!name)return msg("fm","Link Name enter karein.");if(!url)return msg("fm","Link URL enter karein.");if(!/^https?:\/\//i.test(url))url="https://"+url;
 try{new URL(url)}catch{return msg("fm","Valid URL enter karein.")}
 try{
  if(editId)await updateDoc(doc(db,"users",u.uid,"links",editId),{category,name,url,updatedAt:new Date().toISOString()});
  else await addDoc(collection(db,"users",u.uid,"links"),{category,name,url,createdAt:new Date().toISOString()});
  clearForm();msg("fm",editId?"Link updated successfully.":"Link saved online successfully.",true);
 }catch(e){msg("fm","Save failed: "+error(e))}
};
window.edit= id=>{let x=data.find(v=>v.id===id);if(!x)return;editId=id;$("cat").value=x.category;$("name").value=x.name;$("url").value=x.url;$("ft").textContent="✏️ Edit Link";$("cancel").classList.remove("hidden");scrollTo({top:0,behavior:"smooth"})};
window.del=async id=>{let x=data.find(v=>v.id===id),u=auth.currentUser;if(!x||!u||!confirm('Delete "'+x.name+'"?'))return;try{await deleteDoc(doc(db,"users",u.uid,"links",id));msg("fm","Link deleted successfully.",true)}catch(e){msg("fm",error(e))}};
window.openLink=url=>window.open(url,"_blank","noopener,noreferrer");
window.clearForm=()=>{editId=null;$("cat").value="admin";$("name").value="";$("url").value="";$("ft").textContent="➕ Add Link";$("cancel").classList.add("hidden")};

window.render=()=>{let q=($("search").value||"").toLowerCase(),f=$("filter").value,x=data.filter(v=>(f==="all"||v.category===f)&&(!q||(v.name||"").toLowerCase().includes(q)||(v.url||"").toLowerCase().includes(q)));$("list").innerHTML=x.length?x.map(v=>`<div class="item"><div class="top"><div><div class="name">${esc(v.name)}</div><span class="badge">${esc(labels[v.category])}</span><div class="url">${esc(v.url)}</div></div><div class="actions"><button class="green" data-o="${v.id}">🔗 Open Link</button><button class="primary" data-e="${v.id}">✏️ Edit</button><button class="red" data-d="${v.id}">🗑 Delete</button></div></div></div>`).join(""):'<div class="empty">No saved links found.</div>';x.forEach(v=>{$("[data-o='"+v.id+"']").onclick=()=>openLink(v.url);$("[data-e='"+v.id+"']").onclick=()=>edit(v.id);$("[data-d='"+v.id+"']").onclick=()=>del(v.id)})};
function stats(){$("t").textContent=data.length;$("a").textContent=data.filter(x=>x.category==="admin").length;$("w").textContent=data.filter(x=>x.category==="website").length;$("rc").textContent=data.filter(x=>x.category==="github"||x.category==="cloud").length}
render();stats();
</script>
</body>
</html>
