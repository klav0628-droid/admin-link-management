<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Link Management</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:20px}.top{background:#172554;color:#fff;padding:18px 20px;border-radius:16px;margin-bottom:18px}.top h1{margin:0 0 6px;font-size:24px}.top p{margin:0;opacity:.85}.panel{background:#fff;border-radius:16px;padding:18px;margin-bottom:18px;box-shadow:0 5px 20px #0000000b}.auth{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{display:block;font-weight:700;font-size:13px;margin:0 0 6px}input,select,button{width:100%;padding:11px 12px;border:1px solid #d5dbea;border-radius:9px;font-size:14px}button{cursor:pointer;border:0;background:#2563eb;color:#fff;font-weight:700}.btn2{background:#475569}.danger{background:#dc2626}.success{background:#059669}.small{font-size:12px;color:#64748b}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1}.msg{padding:10px;border-radius:9px;margin-top:10px;display:none}.err{background:#fee2e2;color:#991b1b}.ok{background:#dcfce7;color:#166534}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#f8fafc;border-radius:12px;padding:13px}.stat b{display:block;font-size:22px}.toolbar{display:grid;grid-template-columns:1fr 180px;gap:10px}.card{border:1px solid #e2e8f0;border-radius:14px;padding:15px;margin-top:12px}.card h3{margin:0 0 10px}.linkline{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid #eef2f7}.linkline span{font-weight:700;min-width:150px}.linkline a{color:#2563eb;word-break:break-all;text-decoration:none}.card-actions{display:flex;gap:8px;margin-top:12px}.other{margin-top:8px}.other .row{margin-top:7px}.hidden{display:none}@media(max-width:700px){.grid,.auth,.toolbar{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.full{grid-column:auto}.linkline{display:block}.linkline span{display:block;margin-bottom:4px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><h1>Admin Link Management</h1><p>Save every project with Website, GitHub Repository, Firebase/Supabase and other links in one place.</p></div>

<section id="authPanel" class="panel">
<h2>Login / Register</h2>
<div class="auth">
<div><label>Email</label><input id="email" type="email" placeholder="you@example.com"></div>
<div><label>Password</label><input id="password" type="password" placeholder="Minimum 6 characters"></div>
</div>
<div class="actions"><button id="loginBtn">Login</button><button id="registerBtn" class="success">Register</button><button id="resetBtn" class="btn2">Forgot Password</button></div>
<div id="authMsg" class="msg"></div>
</section>

<section id="app" class="hidden">
<div class="panel"><div class="row"><div><b id="userEmail"></b><div class="small">Your links are private to your account.</div></div><button id="logoutBtn" class="btn2" style="max-width:130px">Logout</button></div></div>
<div class="stats"><div class="stat">Projects<b id="sProjects">0</b></div><div class="stat">Websites<b id="sWebsites">0</b></div><div class="stat">GitHub<b id="sGithub">0</b></div><div class="stat">Cloud<b id="sCloud">0</b></div></div>

<section class="panel" style="margin-top:18px">
<h2 id="formTitle">Add Project</h2>
<div class="grid">
<div><label>Project Name *</label><input id="projectName" placeholder="Great India Passbook"></div>
<div><label>Project Type</label><select id="projectType"><option>Admin / Portal</option><option>Website</option><option>Web App</option><option>Android / App</option><option>Other</option></select></div>
<div><label>Website / Portal Link</label><input id="websiteUrl" placeholder="https://example.com"></div>
<div><label>Built With / Source</label><select id="sourcePlatform"><option>GitHub</option><option>GitHub Pages</option><option>Firebase</option><option>Supabase</option><option>GitHub + Firebase</option><option>GitHub + Supabase</option><option>Other</option></select></div>
<div><label>GitHub Repository Name</label><input id="githubRepoName" placeholder="my-project"></div>
<div><label>GitHub Repository Link</label><input id="githubRepoUrl" placeholder="https://github.com/username/repository"></div>
<div><label>Cloud Platform</label><select id="cloudProvider"><option>None</option><option>Firebase</option><option>Supabase</option><option>Other</option></select></div>
<div><label>Cloud Project / Dashboard Link</label><input id="cloudProjectUrl" placeholder="https://console.firebase.google.com/... or Supabase URL"></div>
<div class="full"><label>Other Links</label><div id="otherLinks" class="other"></div><button type="button" id="addOther" class="btn2" style="margin-top:8px">+ Add Other Link</button></div>
</div>
<div class="actions"><button id="saveBtn">Save Project</button><button id="cancelBtn" class="btn2 hidden">Cancel Edit</button></div>
<div id="saveMsg" class="msg"></div>
</section>

<section class="panel"><h2>Saved Projects</h2><div class="toolbar"><input id="search" placeholder="Search project, website, GitHub, cloud..."><select id="filter"><option value="all">All Projects</option><option>Admin / Portal</option><option>Website</option><option>Web App</option><option>Android / App</option><option>Other</option></select></div><div id="list"></div></section>
</section>
</div>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js';
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,sendPasswordResetEmail,signOut,updateProfile} from 'https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js';
import {getFirestore,collection,doc,setDoc,addDoc,deleteDoc,onSnapshot} from 'https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js';

const firebaseConfig={apiKey:'AIzaSyAa7bJ7kEhaL1Ty1MsqMhHGgcvP6uRVKPI',authDomain:'admin-link-management.firebaseapp.com',projectId:'admin-link-management',storageBucket:'admin-link-management.firebasestorage.app',messagingSenderId:'64272413759',appId:'1:64272413759:web:9eb09e9ad129bbd816f48a',measurementId:'G-L0FWVWF2BF'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let uid=null,editingId=null,projects=[];
const $=id=>document.getElementById(id);
function msg(el,text,good=false){el.textContent=text;el.className='msg '+(good?'ok':'err');el.style.display='block'}
function clearMsg(el){el.style.display='none'}
function safeUrl(v){v=(v||'').trim();if(!v)return '';if(!/^https?:\/\//i.test(v))v='https://'+v;try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:''}catch{return ''}}
function esc(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function otherRows(data=[]){$('otherLinks').innerHTML='';(data.length?data:[{}]).forEach(x=>addOtherRow(x.title||'',x.url||''));}
function addOtherRow(title='',url=''){const d=document.createElement('div');d.className='row';d.innerHTML=`<input class="ot" placeholder="Link title" value="${esc(title)}"><input class="ou" placeholder="https://..." value="${esc(url)}"><button type="button" class="danger" style="max-width:45px">×</button>`;d.querySelector('button').onclick=()=>{d.remove();if(!$('otherLinks').children.length)addOtherRow()};$('otherLinks').appendChild(d)}
$('addOther').onclick=()=>addOtherRow();otherRows([]);
function getData(){const urls=[['Website',safeUrl($('websiteUrl').value)],['GitHub',safeUrl($('githubRepoUrl').value)],['Cloud',safeUrl($('cloudProjectUrl').value)]];for(const [n,u] of urls){if($(n==='Website'?'websiteUrl':n==='GitHub'?'githubRepoUrl':'cloudProjectUrl').value.trim()&&!u)throw new Error(n+' link is not a valid URL.');}const other=[];document.querySelectorAll('#otherLinks .row').forEach(r=>{const t=r.querySelector('.ot').value.trim(),u=safeUrl(r.querySelector('.ou').value);if(t||r.querySelector('.ou').value.trim()){if(!u)throw new Error('An Other Link URL is invalid.');other.push({title:t||'Other Link',url:u})}});return{projectName:$('projectName').value.trim(),projectType:$('projectType').value,websiteUrl:urls[0][1],sourcePlatform:$('sourcePlatform').value,githubRepoName:$('githubRepoName').value.trim(),githubRepoUrl:urls[1][1],cloudProvider:$('cloudProvider').value,cloudProjectUrl:urls[2][1],otherLinks:other,updatedAt:Date.now()}}
function resetForm(){editingId=null;$('formTitle').textContent='Add Project';$('saveBtn').textContent='Save Project';$('cancelBtn').classList.add('hidden');['projectName','websiteUrl','githubRepoName','githubRepoUrl','cloudProjectUrl'].forEach(x=>$(x).value='');$('projectType').value='Admin / Portal';$('sourcePlatform').value='GitHub';$('cloudProvider').value='None';otherRows([]);clearMsg($('saveMsg'))}
$('cancelBtn').onclick=resetForm;
$('registerBtn').onclick=async()=>{clearMsg($('authMsg'));try{const e=$('email').value.trim(),p=$('password').value;if(!e||p.length<6)throw new Error('Enter a valid email and password of at least 6 characters.');const c=await createUserWithEmailAndPassword(auth,e,p);await updateProfile(c.user,{displayName:e.split('@')[0]});await setDoc(doc(db,'users',c.user.uid),{email:e,createdAt:Date.now()},{merge:true})}catch(e){msg($('authMsg'),e.message)}};
$('loginBtn').onclick=async()=>{clearMsg($('authMsg'));try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(e){msg($('authMsg'),e.message)}};
$('resetBtn').onclick=async()=>{clearMsg($('authMsg'));try{const e=$('email').value.trim();if(!e)throw new Error('Enter your email first.');await sendPasswordResetEmail(auth,e);msg($('authMsg'),'Password reset email sent.',true)}catch(e){msg($('authMsg'),e.message)}};
$('logoutBtn').onclick=()=>signOut(auth);
$('saveBtn').onclick=async()=>{clearMsg($('saveMsg'));try{if(!uid)throw new Error('Please login first.');const d=getData();if(!d.projectName)throw new Error('Project Name is required.');if(editingId){await setDoc(doc(db,'users',uid,'projects',editingId),d,{merge:true});msg($('saveMsg'),'Project updated successfully.',true)}else{d.createdAt=Date.now();await addDoc(collection(db,'users',uid,'projects'),d);msg($('saveMsg'),'Project saved successfully.',true)}resetForm()}catch(e){msg($('saveMsg'),e.message)}};
function render(){const q=$('search').value.toLowerCase().trim(),f=$('filter').value;let arr=projects.filter(p=>(f==='all'||p.projectType===f)&&(!q||JSON.stringify(p).toLowerCase().includes(q)));$('sProjects').textContent=projects.length;$('sWebsites').textContent=projects.filter(p=>p.websiteUrl).length;$('sGithub').textContent=projects.filter(p=>p.githubRepoUrl).length;$('sCloud').textContent=projects.filter(p=>p.cloudProjectUrl).length;if(!arr.length){$('list').innerHTML='<p class="small">No projects found.</p>';return} $('list').innerHTML=arr.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(p=>{let others=(p.otherLinks||[]).map(x=>`<div class="linkline"><span>${esc(x.title)}</span><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">Open Link</a></div>`).join('');return `<div class="card"><h3>${esc(p.projectName)}</h3><div class="small">${esc(p.projectType)} • Built With: ${esc(p.sourcePlatform)}</div>${p.websiteUrl?`<div class="linkline"><span>Website / Portal</span><a href="${esc(p.websiteUrl)}" target="_blank" rel="noopener noreferrer">Open Website</a></div>`:''}${p.githubRepoUrl?`<div class="linkline"><span>GitHub Repository</span><a href="${esc(p.githubRepoUrl)}" target="_blank" rel="noopener noreferrer">${esc(p.githubRepoName||'Open Repository')}</a></div>`:''}${p.cloudProjectUrl?`<div class="linkline"><span>${esc(p.cloudProvider||'Cloud')}</span><a href="${esc(p.cloudProjectUrl)}" target="_blank" rel="noopener noreferrer">Open Cloud Project</a></div>`:''}${others}<div class="card-actions"><button class="edit" data-id="${p.id}">Edit</button><button class="danger del" data-id="${p.id}">Delete</button></div></div>`}).join('');document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>editProject(b.dataset.id));document.querySelectorAll('.del').forEach(b=>b.onclick=()=>deleteProject(b.dataset.id))}
function editProject(id){const p=projects.find(x=>x.id===id);if(!p)return;editingId=id;$('formTitle').textContent='Edit Project';$('saveBtn').textContent='Update Project';$('cancelBtn').classList.remove('hidden');$('projectName').value=p.projectName||'';$('projectType').value=p.projectType||'Other';$('websiteUrl').value=p.websiteUrl||'';$('sourcePlatform').value=p.sourcePlatform||'Other';$('githubRepoName').value=p.githubRepoName||'';$('githubRepoUrl').value=p.githubRepoUrl||'';$('cloudProvider').value=p.cloudProvider||'None';$('cloudProjectUrl').value=p.cloudProjectUrl||'';otherRows(p.otherLinks||[]);window.scrollTo({top:document.querySelector('.panel:nth-of-type(3)')?.offsetTop||0,behavior:'smooth'})}
async function deleteProject(id){if(!confirm('Delete this project and all its saved links?'))return;try{await deleteDoc(doc(db,'users',uid,'projects',id))}catch(e){alert(e.message)}}
$('search').oninput=render;$('filter').onchange=render;
onAuthStateChanged(auth,user=>{uid=user?.uid||null;$('authPanel').classList.toggle('hidden',!!user);$('app').classList.toggle('hidden',!user);if(!user)return;$('userEmail').textContent=user.email||'';const ref=collection(db,'users',uid,'projects');onSnapshot(ref,s=>{projects=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>msg($('saveMsg'),'Firestore error: '+e.message))});
</script>

<script>
window.addEventListener('unhandledrejection', e => {
  const m = e.reason?.message || String(e.reason || 'Unknown error');
  const el = document.getElementById('saveMsg');
  if (el) { el.textContent = 'Error: ' + m; el.style.color = '#b91c1c'; }
});
</script>
</body></html>
